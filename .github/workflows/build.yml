name: Générer un APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Réseau (IPv6 désactivé + test)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          for h in www.python.org github.com pypi.org dl.google.com; do
            printf "%s -> " "$h"
            curl -4 -sS -o /dev/null -w "%{http_code}\n" --max-time 15 "https://$h" || echo "ECHEC"
          done

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Installer Buildozer
        run: pip install buildozer cython==0.29.37

      - name: Compiler (3 essais max)
        run: |
          for i in 1 2 3; do
            echo "=== Essai $i ==="
            buildozer -v android debug 2>&1 | tee "build-$i.log"
            [ "${PIPESTATUS[0]}" -eq 0 ] && exit 0
            sleep 30
          done
          exit 1

      - name: URL fautive
        if: failure()
        run: |
          grep -h "Downloading" build-*.log | tail -5
          grep -h -B3 "Download failed" build-*.log | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30