name: Générer un APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # 1. Récupérer le code source
      # ---------------------------------------------
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # ---------------------------------------------
      # 2. Compiler l'APK avec Buildozer
      #    (utilise Docker en interne → environnement propre)
      # ---------------------------------------------
      - name: Compiler avec Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
          workdir: .

      # ---------------------------------------------
      # 3. Uploader l'APK comme artifact
      # ---------------------------------------------
      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
          retention-days: 30