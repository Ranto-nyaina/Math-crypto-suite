name: Générer un APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Accepter les licences Android
        run: |
          mkdir -p ~/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> ~/.android/android-sdk-license
          mkdir -p ~/.buildozer/android/packages
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk-license 2>/dev/null || true

      - name: Pré-télécharger freetype (contournement savannah.gnu.org)
        run: |
          mkdir -p ~/.buildozer/android/packages
          cd ~/.buildozer/android/packages
          # Essayer plusieurs miroirs
          wget -q https://mirror.csclub.uwaterloo.ca/gnu/freetype/freetype-2.10.1.tar.gz || \
          wget -q https://ftp.gnu.org/gnu/freetype/freetype-2.10.1.tar.gz || \
          wget -q https://download.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz
          ls -la

      - name: Compiler avec Buildozer
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Uploader l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: tail -100 build.log